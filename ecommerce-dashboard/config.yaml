name: "E-Commerce Dashboard"
description: "React-based e-commerce analytics dashboard for Shopify, Kaufland, eBay, and integrated bookkeeping"
slug: ecommerce-dashboard
url: "https://github.com/Smoothstylez/Ecom-Dash"
version: "0.5.8"

arch:
  - amd64
  - aarch64

init: false
homeassistant_api: false

ingress: true
ingress_port: 8012
webui: "http://[HOST]:[PORT:8012]"

panel_icon: "mdi:chart-box-outline"
panel_title: "E-Commerce"

ports:
  "8012/tcp": 8012
ports_description:
  "8012/tcp": "Web interface"

map:
  - type: data
    read_only: false

options:
  shopify_client_id: ""
  shopify_client_secret: ""
  shopify_shop_domain: ""
  shop_client_key: ""
  shop_secret_key: ""
  amazon_sp_api_client_id: ""
  amazon_sp_api_client_secret: ""
  amazon_sp_api_refresh_token: ""
  app_admin_token: ""
  live_sync_enabled: false
  live_sync_interval_seconds: 300

schema:
  shopify_client_id: "str?"
  shopify_client_secret: "str?"
  shopify_shop_domain: "str?"
  shop_client_key: "str?"
  shop_secret_key: "str?"
  amazon_sp_api_client_id: "str?"
  amazon_sp_api_client_secret: "password?"
  amazon_sp_api_refresh_token: "password?"
  app_admin_token: "password?"
  live_sync_enabled: bool
  live_sync_interval_seconds: "int(10,86400)"

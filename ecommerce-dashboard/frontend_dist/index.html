    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combined Dropshipping Dashboard</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem("dash-combined.theme");
          if (theme) document.documentElement.setAttribute("data-theme", theme);
          var customThemeRaw = localStorage.getItem("dash-combined.custom-theme");
          if (customThemeRaw) {
            var customTheme = JSON.parse(customThemeRaw);
            if (customTheme && typeof customTheme === "object") {
              var lines = [];
              for (var key in customTheme) {
                if (Object.prototype.hasOwnProperty.call(customTheme, key)) {
                  lines.push("  " + key + ": " + customTheme[key] + ";");
                }
              }
              if (lines.length) {
                var style = document.createElement("style");
                style.id = "custom-theme-style";
                style.textContent = '[data-theme="custom"] {\n' + lines.join("\n") + "\n}";
                document.head.appendChild(style);
              }
            }
          }
        } catch (error) {}
      })();
    </script>
